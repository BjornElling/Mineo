name: CI

env:
  # Sørger for Node 24 som sikkerhedsnet, hvis en workflow-action kortvarigt
  # ikke er opdateret endnu. Runtime-gaten nedenfor stopper samtidig ukendte
  # eller forældede action-versioner, før de kan blive kørt.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  verify:
    name: Verify release core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies (strict)
        run: npm ci

      # Den tunge release-gate uden browsermatrixen. E2E-suiten kører nedenfor som selvstændige,
      # parallelle jobs – ét pr. projekt – så hvert projekt beholder én stabil worker uden at
      # blokere de øvrige.
      - name: Verify release
        run: npm run verify:release:core

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

      - name: Install Chromium for verified artifact smoke
        run: npx playwright install --with-deps chromium

      - name: Smoke-test verified Mineo artifact
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
        run: |
          set -euo pipefail
          preview_pid=''
          cleanup() {
            if [[ -n "$preview_pid" ]] && kill -0 "$preview_pid" 2>/dev/null; then
              kill "$preview_pid" 2>/dev/null || true
              wait "$preview_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          npx vite preview --config vite.mineo.config.ts --host 127.0.0.1 --port 4173 --strictPort > /tmp/mineo-preview.log 2>&1 &
          preview_pid=$!
          preview_ready=''
          for attempt in {1..30}; do
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat /tmp/mineo-preview.log
              exit 1
            fi
            if curl --fail --silent --show-error --connect-timeout 1 --max-time 2 http://127.0.0.1:4173/index.html > /dev/null; then
              preview_ready=1
              break
            fi
            sleep 1
          done
          if [[ -z "$preview_ready" ]]; then
            cat /tmp/mineo-preview.log
            exit 1
          fi
          if ! npm run test:e2e -- e2e/production-artifact-smoke.spec.ts --project=chrome-desktop; then
            cat /tmp/mineo-preview.log
            exit 1
          fi

  e2e:
    name: E2E (${{ matrix.project }})
    needs: verify
    runs-on: ubuntu-latest
    # Projekterne er E2E-suitens baner (se `playwright.config.ts`): basisbanen i Chrome kører alle
    # specs, de øvrige motorer kører kun det, der er tagget `@browsere`, og de to
    # minimumsviewporter kun det, der er tagget `@viewporter`. CI kører dermed nøjagtig samme
    # dækning som en lokal `npm run test:e2e`.
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chrome-desktop
            browser: chromium
          - project: edge-desktop
            browser: chromium
          - project: firefox-desktop
            browser: firefox
          - project: safari-webkit-desktop
            browser: webkit
          - project: chrome-desktop-1536x730
            browser: chromium
          - project: chrome-desktop-1366x620
            browser: chromium
          # Browser-eksklusive specs skal også køre mod det verificerede artefakt i CI. De er
          # dedikerede projekter i `playwright.config.ts` og indgår derfor ikke i de seks lane-projekter.
          - project: webkit-filindlaesning
            browser: webkit
          - project: firefox-fallback-audit
            browser: firefox
          - project: chromium-service-worker
            browser: chromium
          - project: firefox-stamdata-save-load
            browser: firefox

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies (strict)
        run: npm ci

      # E2E skal bruge nøjagtig det build, som verify-jobbet kontrollerede og uploadede – ellers
      # kan matrixen bevise et separat `--mode e2e`-build, mens deploy-jobbet bruger noget andet.
      - name: Download verified build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Chrome-/Edge-channel leveres af runner-imaget; Chromium-installationen er den
      # Playwright-motor, som begge channel-projekter bruger som fallback. Hvert job installerer
      # kun sin egen motor, så paralleliseringen ikke betaler for tre ubrugte browserpakker.
      - name: Install Playwright browser engine
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run browser project against verified artifact
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
        run: |
          set -euo pipefail
          preview_pid=''
          cleanup() {
            if [[ -n "$preview_pid" ]] && kill -0 "$preview_pid" 2>/dev/null; then
              kill "$preview_pid" 2>/dev/null || true
              wait "$preview_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          node scripts/serve-e2e-builds.mjs --port 4173 > /tmp/mineo-e2e-preview.log 2>&1 &
          preview_pid=$!
          preview_ready=''
          for attempt in {1..30}; do
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat /tmp/mineo-e2e-preview.log
              exit 1
            fi
            if curl --fail --silent --show-error --connect-timeout 1 --max-time 2 http://127.0.0.1:4173/index.html > /dev/null; then
              preview_ready=1
              break
            fi
            sleep 1
          done
          if [[ -z "$preview_ready" ]]; then
            cat /tmp/mineo-e2e-preview.log
            exit 1
          fi
          npx playwright test --project=${{ matrix.project }}

  deploy:
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # Checkout kun for wrangler-konfigurationerne; der bygges IKKE på ny.
      - name: Checkout
        uses: actions/checkout@v7

      # wrangler-action installerer wrangler i det udcheckede repo, hvor
      # package.json's engines kræver Node >=24.18.0. Dette trin sikrer, at
      # deploy-jobbet bruger samme projekt-runtime som verify-jobbet.
      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify GitHub Actions runtimes
        run: npm run check:github-actions-runtime

      - name: Download verified build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Deploy Mineo
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.mineo.json

      - name: Deploy MinProcesrente
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.minprocesrente.json
