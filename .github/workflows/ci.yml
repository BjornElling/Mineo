name: CI

# Ingen `FORCE_JAVASCRIPT_ACTIONS_TO_NODE24`: alle actions kører allerede på Node 24, og
# `check:github-actions-runtime` afviser enhver action, der ikke gør, før den kan blive kørt.

on:
  pull_request:
  push:
    branches: [ main ]

# **Jobgrafen.** `build` laver det ene artefakt, som E2E-matrixen tester, og som `deploy` udruller.
# `verify` kører hele release-gaten (typer, lint, værn, coverage-suiten) parallelt med det – den
# behøver ikke vente på artefaktet, og E2E behøver ikke vente på den. Deploy kræver alle tre.
#
# **Concurrency.** Hvert job har sin egen gruppe pr. ref med `cancel-in-progress`: et nyt push til
# samme branch/PR afbryder den forrige kørsels build, verify og E2E, så der ikke bruges en halv time
# på en commit, der allerede er overhalet. Den afbrudte kørsel når aldrig til deploy. Deploy-jobbet
# selv afbrydes ALDRIG midt i en udrulning (se dets egen gruppe).

jobs:
  build:
    name: Build verified artifact
    runs-on: ubuntu-26.04
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Build-info (version, commit) udledes af git-historikken.
          fetch-depth: 0

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # npm-cachen holder kun registry-tarballs; `npm ci` installerer stadig præcis det låste
          # træ og kontrollerer hver tarballs integrity-hash mod package-lock.json.
          cache: npm

      - name: Setup npm from packageManager
        run: npm install --global "$(node --print 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"

      - name: Install dependencies (strict)
        run: npm ci

      # `build:all` kører `verify-build-artifacts.mjs` på begge varianter: entry, manifest,
      # PWA-assets, versionspar, fravær af automatiseringsbroen og størrelsesbudgettet.
      - name: Build
        run: npm run build:all

      - name: Install Chromium for verified artifact smoke
        # Genforsøg ved DNS-/netværksudfald; manglende installation stopper stadig jobbet.
        run: node scripts/install-playwright.mjs chromium

      - name: Smoke-test verified Mineo artifact
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
        run: |
          set -euo pipefail
          preview_pid=''
          cleanup() {
            if [[ -n "$preview_pid" ]] && kill -0 "$preview_pid" 2>/dev/null; then
              kill "$preview_pid" 2>/dev/null || true
              wait "$preview_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          npx vite preview --config vite.mineo.config.ts --host 127.0.0.1 --port 4173 --strictPort > /tmp/mineo-preview.log 2>&1 &
          preview_pid=$!
          preview_ready=''
          for attempt in {1..30}; do
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat /tmp/mineo-preview.log
              exit 1
            fi
            if curl --fail --silent --show-error --connect-timeout 1 --max-time 2 http://127.0.0.1:4173/index.html > /dev/null; then
              preview_ready=1
              break
            fi
            sleep 1
          done
          if [[ -z "$preview_ready" ]]; then
            cat /tmp/mineo-preview.log
            exit 1
          fi
          if ! npm run test:e2e -- e2e/production-artifact-smoke.spec.ts --project=chrome-desktop; then
            cat /tmp/mineo-preview.log
            exit 1
          fi

      # Først efter smoke-testen: et artefakt, der ikke kan starte, skal hverken testes videre eller
      # kunne udrulles.
      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  verify:
    name: Verify release core
    runs-on: ubuntu-26.04
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup npm from packageManager
        run: npm install --global "$(node --print 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"

      - name: Install dependencies (strict)
        run: npm ci

      # Den tunge release-gate uden browsermatrixen. Den bygger også selv (buildbarhed og
      # buildværn er en del af gaten), men det artefakt, der testes og udrulles, er `build`-jobbets.
      - name: Verify release
        run: npm run verify:release:core

  e2e:
    name: E2E (${{ matrix.project }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    needs: build
    runs-on: ubuntu-26.04
    concurrency:
      group: e2e-${{ github.ref }}-${{ matrix.project }}-${{ matrix.shard || 'hel' }}
      cancel-in-progress: true
    # Projekterne er E2E-suitens baner (se `playwright.config.ts`): basisbanen i Chrome kører alle
    # specs, de øvrige motorer kører kun det, der er tagget `@browsere`, og de to
    # minimumsviewporter kun det, der er tagget `@viewporter`. CI kører dermed nøjagtig samme
    # dækning som en lokal `npm run test:e2e`.
    #
    # Basisbanen er delt i fire shards. Den bærer hele suiten og var med én worker alene ~14 min –
    # resten af matrixen er færdig på 1-3 min. Hver shard kører stadig én test ad gangen, så
    # stabiliteten er den samme som før; kun væguret er delt op.
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chrome-desktop
            browser: chromium
            shard: 1/4
          - project: chrome-desktop
            browser: chromium
            shard: 2/4
          - project: chrome-desktop
            browser: chromium
            shard: 3/4
          - project: chrome-desktop
            browser: chromium
            shard: 4/4
          - project: edge-desktop
            browser: chromium
          - project: firefox-desktop
            browser: firefox
          - project: safari-webkit-desktop
            browser: webkit
          - project: chrome-desktop-1536x730
            browser: chromium
          - project: chrome-desktop-1366x620
            browser: chromium
          # Browser-eksklusive specs skal også køre mod det verificerede artefakt i CI. De er
          # dedikerede projekter i `playwright.config.ts` og indgår derfor ikke i de seks lane-projekter.
          - project: webkit-filindlaesning
            browser: webkit
          - project: firefox-fallback-audit
            browser: firefox
          - project: chromium-service-worker
            browser: chromium
          - project: firefox-stamdata-save-load
            browser: firefox

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # npm-cachen holder kun registry-tarballs; `npm ci` installerer stadig præcis det låste
          # træ og kontrollerer hver tarballs integrity-hash mod package-lock.json.
          cache: npm

      - name: Setup npm from packageManager
        run: npm install --global "$(node --print 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"

      - name: Install dependencies (strict)
        run: npm ci

      # E2E skal bruge nøjagtig det build, som build-jobbet kontrollerede og uploadede – ellers
      # kan matrixen bevise et separat `--mode e2e`-build, mens deploy-jobbet bruger noget andet.
      - name: Download verified build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Chrome-/Edge-channel leveres af runner-imaget; Chromium-installationen er den
      # Playwright-motor, som begge channel-projekter bruger som fallback. Hvert job installerer
      # kun sin egen motor, så paralleliseringen ikke betaler for tre ubrugte browserpakker.
      - name: Install Playwright browser engine
        run: node scripts/install-playwright.mjs ${{ matrix.browser }}

      - name: Run browser project against verified artifact
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          preview_pid=''
          cleanup() {
            if [[ -n "$preview_pid" ]] && kill -0 "$preview_pid" 2>/dev/null; then
              kill "$preview_pid" 2>/dev/null || true
              wait "$preview_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          node scripts/serve-e2e-builds.mjs --port 4173 > /tmp/mineo-e2e-preview.log 2>&1 &
          preview_pid=$!
          preview_ready=''
          for attempt in {1..30}; do
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat /tmp/mineo-e2e-preview.log
              exit 1
            fi
            if curl --fail --silent --show-error --connect-timeout 1 --max-time 2 http://127.0.0.1:4173/index.html > /dev/null; then
              preview_ready=1
              break
            fi
            sleep 1
          done
          if [[ -z "$preview_ready" ]]; then
            cat /tmp/mineo-e2e-preview.log
            exit 1
          fi
          shard_args=()
          if [[ -n "$PLAYWRIGHT_SHARD" ]]; then
            shard_args=("--shard=$PLAYWRIGHT_SHARD")
          fi
          npx playwright test --project=${{ matrix.project }} "${shard_args[@]}"

  deploy:
    needs: [build, verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    # Én udrulning ad gangen, og en igangværende afbrydes aldrig (en halv udrulning kan efterlade
    # Mineo og MinProcesrente på hver sin version). En nyere kørsel venter; står flere og venter,
    # erstatter GitHub den ældre ventende med den nyeste.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      # Checkout for wrangler-konfigurationerne og deploy-scriptet; der bygges IKKE på ny.
      - name: Checkout
        uses: actions/checkout@v7

      # Værn mod at en ældre commit overskriver en nyere: er main rykket videre, mens denne kørsel
      # testede, udruller den nyere commits egen kørsel – også selv om denne kørsel tilfældigvis når
      # frem til deploy sidst.
      - name: Skip if main has moved on
        id: head
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "::notice title=Deploy sprunget over::main peger nu på ${remote_head:0:8}; den nyere kørsel udruller."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node from .nvmrc
        if: steps.head.outputs.current == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Udrulningen bruger det låste wrangler fra package-lock.json – samme version, som
      # `check:dependencies` har kontrolleret – i stedet for den, en action selv installerer.
      - name: Setup npm from packageManager
        if: steps.head.outputs.current == 'true'
        run: npm install --global "$(node --print 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"

      - name: Install dependencies (strict)
        if: steps.head.outputs.current == 'true'
        run: npm ci

      - name: Verify GitHub Actions runtimes
        if: steps.head.outputs.current == 'true'
        run: npm run check:github-actions-runtime

      - name: Download verified build artifacts
        if: steps.head.outputs.current == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # `deploy-cloudflare.mjs` gentager kun ved forbigående fejl fra Cloudflares API (5xx, timeouts);
      # en ægte fejl som et ugyldigt token fejler med det samme.
      - name: Deploy Mineo
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-cloudflare.mjs wrangler.mineo.json

      - name: Deploy MinProcesrente
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-cloudflare.mjs wrangler.minprocesrente.json
