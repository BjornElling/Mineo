name: CI

env:
  # Sørger for Node 24 som sikkerhedsnet, hvis en workflow-action kortvarigt
  # ikke er opdateret endnu. Runtime-gaten nedenfor stopper samtidig ukendte
  # eller forældede action-versioner, før de kan blive kørt.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies (strict)
        run: npm ci

      # E2E-suiten kører den samme browser-matrix som den lokale audit: Chrome-/Edge-channel
      # leveres af runner-imaget, mens Playwright-motorerne skal installeres eksplicit.
      - name: Install Playwright browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      # Én autoritativ gate. Identisk med lokal `npm run check`:
      # runtime-gates + typecheck + typecheck:test + lint + mojibake/casing + Vitest m. coverage + build:all.
      # De byggede `dist/`-artefakter herfra er præcis dem, deploy-jobbet udgiver.
      - name: Verify release
        run: npm run verify:release

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # Checkout kun for wrangler-konfigurationerne; der bygges IKKE på ny.
      - name: Checkout
        uses: actions/checkout@v6

      # wrangler-action installerer wrangler i det udcheckede repo, hvor
      # package.json's engines kræver Node >=24.18.0. Dette trin sikrer, at
      # deploy-jobbet bruger samme projekt-runtime som verify-jobbet.
      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify GitHub Actions runtimes
        run: npm run check:github-actions-runtime

      - name: Download verified build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Deploy Mineo
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.mineo.json

      - name: Deploy MinProcesrente
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.minprocesrente.json
