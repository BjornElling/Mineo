name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies (strict)
        run: npm ci

      # Én autoritativ gate. Identisk med lokal `npm run check`:
      # typecheck + typecheck:test + lint + mojibake/casing + Vitest m. coverage + build:all.
      # De byggede `dist/`-artefakter herfra er præcis dem, deploy-jobbet udgiver.
      - name: Verify release
        run: npm run verify:release

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # Checkout kun for wrangler-konfigurationerne; der bygges IKKE på ny.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy Mineo
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.mineo.json

      - name: Deploy MinProcesrente
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.minprocesrente.json
